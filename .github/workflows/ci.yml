name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    name: Build & Test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install dependencies
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run iOS tests
        run: |
          if DEVICE_ID=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone 16/ && /Booted|Shutdown/ { print $2; exit }') && [ -n "$DEVICE_ID" ]; then
            DESTINATION="platform=iOS Simulator,id=$DEVICE_ID"
          elif DEVICE_ID=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone 15/ && /Booted|Shutdown/ { print $2; exit }') && [ -n "$DEVICE_ID" ]; then
            DESTINATION="platform=iOS Simulator,id=$DEVICE_ID"
          else
            DESTINATION="platform=iOS Simulator,name=iPhone 14"
          fi

          xcodebuild test \
            -project PlotLoom.xcodeproj \
            -scheme PlotLoom_iOS \
            -only-testing:PlotLoomTests_iOS \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify

      - name: Run macOS tests
        run: |
          xcodebuild test \
            -project PlotLoom.xcodeproj \
            -scheme PlotLoom_macOS \
            -only-testing:PlotLoomTests_macOS \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify
