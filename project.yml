name: BookLoom
options:
  bundleIdPrefix: net.shadowpuppet
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: TYQ32QCF6K
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 15
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  BookLoom_iOS:
    build:
      targets:
        BookLoom_iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BookLoomTests_iOS
        - BookLoomUITests_iOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BookLoom_macOS:
    build:
      targets:
        BookLoom_macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BookLoomTests_macOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  BookLoom:
    type: application
    platform: [iOS, macOS]
    sources:
      - BookLoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.PlotLoom
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: BookLoom
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        # BookLoom-macOS.entitlements is manually maintained because XcodeGen cannot
        # generate per-SDK entitlements. It mirrors the iOS keys (CloudKit, network)
        # PLUS macOS App Sandbox keys required for Mac App Store / TestFlight.
        # When shared capabilities change in `entitlements:` below, also update
        # BookLoom/App/BookLoom-macOS.entitlements by hand.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": BookLoom/App/BookLoom-macOS.entitlements
    info:
      path: BookLoom/App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: BookLoom
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        UIBackgroundModes:
          - fetch
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: net.shadowpuppet.BookLoom
            CFBundleURLSchemes:
              - bookloom
    entitlements:
      path: BookLoom/App/BookLoom.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.shadowpuppet.PlotLoom
        com.apple.developer.icloud-services:
          - CloudKit

  BookLoomTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BookLoomTests
    dependencies:
      - target: BookLoom_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.BookLoom.tests
        GENERATE_INFOPLIST_FILE: YES

  BookLoomUITests_iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BookLoomUITests
    dependencies:
      - target: BookLoom_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.BookLoom.uitests
        GENERATE_INFOPLIST_FILE: YES

  BookLoomTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BookLoomTests
    dependencies:
      - target: BookLoom_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.BookLoom.tests
        GENERATE_INFOPLIST_FILE: YES
