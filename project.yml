name: BookLoom
options:
  bundleIdPrefix: net.shadowpuppet
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: TYQ32QCF6K
    MARKETING_VERSION: "1.2.6"
    CURRENT_PROJECT_VERSION: 66
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  BookLoom_iOS:
    build:
      targets:
        BookLoom_iOS: all
        BookLoomShareExtension: all
    run:
      config: Debug
      executable: BookLoom_iOS
      commandLineArguments:
        "-SeedSampleData": true
    test:
      config: Debug
      targets:
        - BookLoomTests_iOS
        - BookLoomUITests_iOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BookLoom_macOS:
    build:
      targets:
        BookLoom_macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BookLoomTests_macOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  BookLoom:
    type: application
    platform: [iOS, macOS]
    sources:
      - BookLoom
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.PlotLoom
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: BookLoom
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSCameraUsageDescription: Scan ISBN barcodes and printed ISBNs to find book details.
        # Supported orientations are declared directly in BookLoom/App/Info.plist
        # (UISupportedInterfaceOrientations + ~ipad). INFOPLIST_KEY_* build settings
        # have no effect when a custom info.path plist is used, so they're omitted here.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        # BookLoom-macOS.entitlements is manually maintained because XcodeGen cannot
        # generate per-SDK entitlements. It mirrors the iOS keys (CloudKit, network)
        # PLUS macOS App Sandbox keys required for Mac App Store / TestFlight.
        # When shared capabilities change in `entitlements:` below, also update
        # BookLoom/App/BookLoom-macOS.entitlements by hand.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": BookLoom/App/BookLoom-macOS.entitlements
    info:
      path: BookLoom/App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: BookLoom
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scan ISBN barcodes and printed ISBNs to find book details.
        CKSharingSupported: true
        UIBackgroundModes:
          - fetch
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: net.shadowpuppet.BookLoom
            CFBundleURLSchemes:
              - bookloom
    entitlements:
      path: BookLoom/App/BookLoom.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.shadowpuppet.PlotLoom
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.net.shadowpuppet.PlotLoom
    dependencies:
      - target: BookLoomShareExtension
        embed: true
        codeSign: true
        platforms: [iOS]

  BookLoomTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BookLoomTests
    dependencies:
      - target: BookLoom_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.BookLoom.tests
        GENERATE_INFOPLIST_FILE: YES

  BookLoomUITests_iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BookLoomUITests
    dependencies:
      - target: BookLoom_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.BookLoom.uitests
        GENERATE_INFOPLIST_FILE: YES

  BookLoomTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BookLoomTests
    dependencies:
      - target: BookLoom_macOS
      - target: InboxProcessHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.BookLoom.tests
        GENERATE_INFOPLIST_FILE: YES

  InboxProcessHelper:
    type: tool
    platform: macOS
    sources:
      - InboxProcessHelper
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.BookLoom.InboxProcessHelper

  BookLoomShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - BookLoomShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.PlotLoom.ShareExtension
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BookLoomShareExtension/BookLoomShareExtension.entitlements
        INFOPLIST_FILE: BookLoomShareExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: BookLoom
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: YES
